<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>지호의 일기 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Gowun+Dodum&display=swap">
<style>
/* 「달달맘의 글분석 학습지」와 같은 한 가지 모습(흰 종이 만화 카드)으로 만든 페이지: 배경과 글자색을 모두 직접 지정합니다.
   Layout: 왼쪽에 달달쌤 말풍선(고정) + 오른쪽 단계 카드, 위에 동그라미 번호 단계 레일 */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --ink:#342A2A; --ink-2:#6C5F5F; --ink-3:#A89B9B;
  --pink:#F5A3B7; --pink-soft:#FDE7ED; --pink-b:#EE9DB1;
  --lav:#F6E3F4; --lav-b:#E2A6D7;
  --lime:#EAF7CB; --peach:#FFF3E6; --peach-b:#F7CDA4;
  --blue:#4568CF; --blue-soft:#EAF0FC; --coral:#E3544B;
  --hl:#FFD2DC; --hl-y:#FFE7A3; --hl-g:#D9F0B8;
  --ok:#3E9B58; --ok-soft:#E8F6DF;
  --rule:#E3E9F7; --margin:#F6B7C4; --line:#E6DCDC; --star:#F5B73C; --sky:#9DC4F0;
  --lh:38px;
  --f-hand:'Gaegu','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-pen:'Nanum Pen Script','Gaegu','Apple SD Gothic Neo',cursive;
  --f-text:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{word-break:keep-all;overflow-wrap:anywhere;font-family:var(--f-hand);font-size:19px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
h1,h2,h3,h4{font-family:var(--f-hand);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 64px}
.hl{background:linear-gradient(to bottom,transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%);padding:0 3px}
.hl-y{background:linear-gradient(to bottom,transparent 55%,var(--hl-y) 55%,var(--hl-y) 92%,transparent 92%);padding:0 3px}
.hl-g{background:linear-gradient(to bottom,transparent 55%,var(--hl-g) 55%,var(--hl-g) 92%,transparent 92%);padding:0 3px}
.red{color:var(--coral)}
.doodle{font-family:var(--f-pen);color:var(--coral);font-size:24px;line-height:1;display:inline-block;transform:rotate(-7deg);white-space:nowrap}
.chr{display:block;flex:none;width:110px}
.chr svg{display:block;width:100%;height:auto;overflow:visible}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes stamp{0%{opacity:0;transform:scale(1.6) rotate(-20deg)}70%{opacity:1;transform:scale(.94) rotate(-10deg)}100%{transform:scale(1) rotate(-12deg)}}
.circ{display:inline-grid;place-items:center;width:34px;height:34px;border:2.5px solid var(--ink);border-radius:50%;font-size:20px;flex:none;line-height:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 버튼·칩 */
.btn{border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:4px 18px;font-size:20px;font-weight:700;transition:transform .12s;display:inline-block;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{transform:translateY(-2px)} .btn:active{transform:none}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.pri{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.soft{background:var(--lime)}
.btn.sm{font-size:17px;padding:2px 14px;border-width:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:2px solid #E4DADA;background:#fff;border-radius:999px;padding:1px 14px;font-size:19px;font-weight:700;transition:transform .1s,border-color .15s,background-color .15s;text-align:left}
.chip:hover{border-color:var(--ink);transform:translateY(-1px)}
.chip:active{transform:none}
.chip[aria-pressed="true"]{background:var(--pink-soft);border-color:var(--coral);color:var(--coral)}
.chip small{font-family:var(--f-text);font-size:12px;color:var(--ink-3);font-weight:400}
.chip.y[aria-pressed="true"]{background:#FFF6D6;border-color:#E9B04A;color:#9A6A10}

/* 첫 화면 */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px 28px;align-items:end;padding-block:4px 14px}
.kicker{font-size:17px;color:var(--ink-2)}
.brand{font-size:clamp(44px,8vw,76px);line-height:1;margin-top:6px;letter-spacing:-.02em}
.brand .red{white-space:nowrap}
.sub{font-size:21px;margin-top:12px;font-weight:700}
.hero-c{display:flex;align-items:flex-end;gap:8px;justify-content:center}
.hero-c .bubble{max-width:290px}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:6px}
.week{border:2.5px solid var(--peach-b);border-radius:6px;padding:12px 18px 14px;background:#fff;display:flex;flex-direction:column;gap:10px}
.week h3,.start h3{font-size:24px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:18px}
.day .dot{width:100%;max-width:58px;aspect-ratio:1;border:2.5px dashed var(--line);border-radius:50%;display:grid;place-items:center;position:relative}
.day.today .dot{border-color:var(--coral);border-style:solid}
.day .dot.on{border-style:solid;border-color:var(--coral);background:var(--pink-soft)}
.day .dot.on::after{content:'참\A잘함';white-space:pre;font-family:var(--f-pen);color:var(--coral);font-size:18px;line-height:.95;text-align:center;transform:rotate(-12deg)}
.day small{font-family:var(--f-text);font-size:12px;color:var(--ink-3)}
.week p{font-family:var(--f-text);font-size:14px;color:var(--ink-2)}
.start{border:2.5px solid var(--lav-b);background:var(--lav);border-radius:6px;padding:12px 18px 16px;display:flex;flex-direction:column;gap:10px}
.start p{font-family:var(--f-text);font-size:15px;line-height:1.7}
.start .row .btn{font-size:22px}
.who{display:flex;align-items:center;gap:8px;font-size:18px;color:var(--ink-2)}
.who input{width:5.5em;font-size:21px;font-weight:700;border:0;border-bottom:2.5px dashed var(--lav-b);background:transparent;padding:0 2px}
.who input:focus{outline:none;border-bottom-color:var(--coral)}
.shelf h3{font-size:28px;margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
.shelf h3 small{font-family:var(--f-pen);font-size:22px;color:var(--ink-3);font-weight:400}
.entries{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.ent{position:relative;display:flex;flex-direction:column;gap:4px;text-align:left;background:#fff;border:2.5px solid var(--c,var(--pink-b));border-radius:6px;padding:10px 14px 12px;transition:transform .15s;min-width:0}
.ent:nth-child(4n+2){--c:var(--peach-b)} .ent:nth-child(4n+3){--c:var(--lav-b)} .ent:nth-child(4n+4){--c:var(--sky)}
.ent:hover{transform:translateY(-3px) rotate(-.5deg)}
.ent .dt{font-size:17px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.ent .dt svg{width:24px;height:24px}
.ent b{font-size:24px;line-height:1.15}
.ent .snip{font-family:var(--f-text);font-size:13.5px;line-height:1.6;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ent .tag{font-size:15px;color:var(--ink-3)}
.ent .ex{font-family:var(--f-pen);font-size:20px;color:var(--blue);line-height:1}
.ent .st{position:absolute;right:8px;top:6px;font-family:var(--f-pen);color:var(--coral);font-size:18px;border:2px solid var(--coral);border-radius:50%;width:50px;height:50px;display:grid;place-items:center;line-height:.95;text-align:center;transform:rotate(12deg);opacity:.85}

/* 단계 레일 */
.top{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;margin-bottom:10px}
.top h1{font-size:30px}
.rail-wrap{overflow-x:auto;margin-bottom:16px;scrollbar-width:thin}
.steps{display:flex;gap:6px;padding:2px 2px 6px;min-width:max-content}
.stp{font-size:18px;padding:2px 14px 2px 4px;border-radius:999px;border:2px solid #E6DEDE;color:var(--ink-3);white-space:nowrap;display:inline-flex;gap:6px;align-items:center;background:#fff;transition:transform .12s}
.stp:hover{transform:translateY(-2px)}
.stp b{display:inline-grid;place-items:center;width:26px;height:26px;border:2px solid currentColor;border-radius:50%;font-size:16px}
.stp[aria-current="step"]{border-color:var(--coral);color:var(--coral);background:var(--pink-soft);font-weight:700}
.stp.done{color:var(--ink);border-color:var(--ink-3)}
.stp.done b{border-color:var(--coral);color:var(--coral)}

.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
.teacher{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:10px}
.tface{display:flex;gap:8px;align-items:flex-end}
.tface .chr{width:100px}
.tname h3{font-size:28px}
.tname small{display:block;font-family:var(--f-pen);font-size:21px;color:var(--coral);line-height:1.1}
.bubble{position:relative;background:var(--lime);border:2.5px solid var(--ink);border-radius:26px;padding:12px 18px;font-size:20px;font-weight:700;line-height:1.45}
.teacher .bubble::after{content:'';position:absolute;left:40px;top:-11px;width:18px;height:18px;background:inherit;border-left:2.5px solid var(--ink);border-top:2.5px solid var(--ink);transform:rotate(40deg) skewX(-6deg)}
.hero-c .bubble::after{content:'';position:absolute;left:-10px;bottom:22px;width:18px;height:18px;background:inherit;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(30deg) skewX(-10deg)}
.bubble p+p{margin-top:6px}
.bubble b{color:var(--coral)}
.momsend{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2.5px solid var(--pink-b);background:var(--pink-soft);border-radius:10px}
.momsend > div{flex:1;display:grid;min-width:0}
.momsend b{font-size:20px} .momsend span{font-size:14px;color:var(--ink-2);font-family:var(--f-text)}

/* 카드 */
.card{position:relative;background:#fff;border:2.5px solid var(--peach-b);border-radius:6px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;animation:pop .2s ease;min-width:0}
.card > h2{font-size:34px;display:flex;align-items:center;gap:10px}
.card h3{font-size:24px}
.lead{font-family:var(--f-text);font-size:15px;color:var(--ink-2);line-height:1.7}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:4px}
.box{border:2px dashed var(--peach-b);background:var(--peach);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.box.lav{border-color:var(--lav-b);background:var(--lav)}
.box.pink{border-color:var(--pink-b);background:var(--pink-soft)}
.box h4{font-size:21px}
.box ul{margin:0;padding-left:20px;font-family:var(--f-text);font-size:15.5px;line-height:1.8}
.status{font-family:var(--f-pen);font-size:22px;color:var(--coral);min-height:1.2em}

/* ① 날짜 */
.datebig{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.datebig b{font-size:clamp(34px,6vw,48px);line-height:1}
.datebig input{font-family:var(--f-text);font-size:16px;border:2px dashed var(--peach-b);border-radius:8px;padding:4px 10px;background:var(--peach)}
.wx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wbtn{display:flex;flex-direction:column;align-items:center;gap:2px;border:2.5px solid var(--line);border-radius:10px;padding:8px 4px;background:#fff;font-size:18px;font-weight:700;transition:transform .12s,border-color .15s}
.wbtn svg{width:52px;height:52px}
.wbtn:hover{transform:translateY(-2px);border-color:var(--ink)}
.wbtn[aria-pressed="true"]{border-color:var(--coral);background:var(--pink-soft)}
.field{display:grid;gap:4px;font-size:19px;font-weight:700}
.field input,.field textarea{width:100%;font-family:var(--f-text);font-size:16px;font-weight:400;line-height:1.6;border:2px dashed var(--peach-b);border-radius:8px;padding:7px 10px;background:var(--peach)}
.field input:focus,.field textarea:focus{outline:none;border-style:solid;border-color:var(--coral);background:#fff}
.field textarea{min-height:64px;resize:vertical}

.must{display:inline-block;background:var(--coral);color:#fff;font-size:15px;border-radius:999px;padding:0 10px;vertical-align:middle}
.chip.wl{font-size:18px}
.chip.wl[aria-pressed="true"]{background:#FFF6D6;border-color:#E9B04A;color:var(--ink)}
.wown{width:100%;font-family:var(--f-text);font-size:16px;line-height:1.6;border:2px dashed var(--peach-b);border-radius:8px;padding:7px 10px;background:#fff}
.wown:focus{outline:none;border-style:solid;border-color:var(--coral)}
.wown.bad{border-color:var(--coral)}
.wxmsg{font-family:var(--f-pen);font-size:22px;color:var(--ink-2);line-height:1.2}
.wxmsg.ok{color:var(--ok)} .wxmsg.no{color:var(--coral)}
.titlein.need{background:var(--pink-soft);border-bottom:3px dashed var(--coral)}
.tneed{font-family:var(--f-pen);font-size:22px;color:var(--coral);padding:4px 14px 0;background:#fff}
/* ② 주제 */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tg{border:2.5px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:#fff}
.tg.on{border-color:var(--coral);background:#FFFAFB}
.tg h3{font-size:23px;display:flex;align-items:center;gap:8px}
.tg h3 small{font-family:var(--f-pen);font-size:19px;color:var(--ink-3);font-weight:400}
.tg .chips .chip{font-size:17px}
.dice{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.talk{display:flex;gap:10px;align-items:flex-start}
.talk .chr{width:70px}
.talk ol{margin:0;padding-left:22px;font-size:20px;display:grid;gap:2px}

/* ③ 양식 */
.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fm{position:relative;display:flex;flex-direction:column;gap:4px;text-align:left;border:2.5px solid var(--line);border-radius:10px;padding:10px 14px 12px;background:#fff;transition:transform .12s,border-color .15s}
.fm:hover{transform:translateY(-2px);border-color:var(--ink)}
.fm[aria-pressed="true"]{border-color:var(--coral);background:var(--pink-soft)}
.fm b{font-size:24px;line-height:1.1}
.fm span{font-family:var(--f-text);font-size:14px;line-height:1.6;color:var(--ink-2)}
.fm em{font-style:normal;font-family:var(--f-pen);font-size:20px;color:var(--blue)}
.fm .rec{position:absolute;right:10px;top:-12px;background:var(--coral);color:#fff;font-size:15px;border-radius:999px;padding:0 10px}
.fm .mini{height:46px;border-radius:6px;background:repeating-linear-gradient(to bottom,#fff 0 13px,var(--rule) 13px 15px);border:1.5px solid var(--line);position:relative;overflow:hidden}
.fm .mini i{position:absolute;font-style:normal;font-size:13px;color:var(--coral);font-family:var(--f-text)}

/* ④ 재료 */
.q{display:grid;gap:6px;padding:10px 0;border-bottom:2px dashed var(--line)}
.q:last-of-type{border-bottom:0}
.q label{font-size:21px;font-weight:700;display:flex;align-items:center;gap:8px}
.q label .circ{width:30px;height:30px;font-size:17px}
.q input,.q textarea{width:100%;font-family:var(--f-text);font-size:16px;line-height:1.6;border:2px dashed var(--peach-b);border-radius:8px;padding:6px 10px;background:var(--peach)}
.q textarea{min-height:58px;resize:vertical}
.q input:focus,.q textarea:focus{outline:none;border-style:solid;border-color:var(--coral);background:#fff}
.q .ex{font-family:var(--f-text);font-size:13px;color:var(--ink-3)}
.blank-sent{font-family:var(--f-text);font-size:17px;line-height:2.4}
.blank-sent input{font-family:var(--f-text);font-size:16px;border:0;border-bottom:2.5px solid var(--ink);background:var(--hl-y);border-radius:4px 4px 0 0;padding:1px 6px;width:9em;max-width:100%;text-align:center}
.blank-sent input:focus{outline:none;background:var(--hl);border-bottom-color:var(--coral)}
.blank-sent li{margin-bottom:2px}
.blank-sent ol{margin:0;padding-left:22px}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;padding:0 2px;font-size:32px;line-height:1;color:var(--line)}
.stars button.on{color:var(--star)}
.bq{font-size:22px;font-weight:700;line-height:1.4}
.feel-tabs{display:flex;flex-wrap:wrap;gap:6px}
.feel-tabs button{border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:2px 14px;font-size:19px;font-weight:700}
.feel-tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* 그림판 */
.pad{display:flex;flex-direction:column;gap:8px}
.cw{position:relative;width:100%;max-width:620px;aspect-ratio:3/2;border:2.5px solid var(--ink);border-radius:4px;background:#fff;touch-action:none;overflow:hidden}
.cw canvas{position:absolute;inset:0;width:100%;height:100%}
.pens{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink)}
.sw[aria-pressed="true"]{outline:3px solid var(--coral);outline-offset:2px}
.tool{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:0 10px;font-size:17px;font-weight:700;min-height:32px}
.tool[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ⑤ 쓰기 */
.wlayout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.note{background:#fff;border:2.5px solid var(--blue);border-radius:4px;display:flex;flex-direction:column;min-width:0}
.note .nh{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:8px 12px;border-bottom:2px dashed #C9D5F2;background:var(--blue-soft);font-size:18px}
.note .nh svg{width:28px;height:28px}
.titlein{width:100%;border:0;border-bottom:2.5px solid var(--ink);font-family:var(--f-hand);font-size:28px;font-weight:700;padding:6px 14px 2px;background:#fff}
.titlein:focus{outline:none;border-bottom-color:var(--coral)}
.titlein::placeholder,.paper::placeholder{color:var(--ink-3);font-weight:400}
.tsug{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:2px dashed #E3E9F7;align-items:center}
.tsug span{font-family:var(--f-pen);font-size:20px;color:var(--coral)}
.tsug .chip{font-size:16px}
.paper{display:block;width:100%;min-height:calc(var(--lh) * 11);border:0;resize:vertical;padding:4px 14px 14px 52px;font-family:var(--f-text);font-size:18px;line-height:var(--lh);background-color:#fff;
  background-image:linear-gradient(to right,transparent 40px,var(--margin) 40px,var(--margin) 42px,transparent 42px),linear-gradient(to bottom,transparent calc(var(--lh) - 1.5px),var(--rule) calc(var(--lh) - 1.5px));
  background-size:100% 100%,100% var(--lh);background-position:0 0,0 4px;background-attachment:local}
.paper:focus{outline:none}
.nfoot{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding:6px 12px;border-top:2px dashed #C9D5F2;font-size:18px;color:var(--ink-2)}
.nfoot b{color:var(--ink);font-size:22px}

function parseT(t){const out=[];const re=/\{([^}]+)\}|\[([^\]]+)\]/g;let i=0,m;while((m=re.exec(t))){if(m.index>i)out.push({x:t.slice(i,m.index)});out.push(m[1]?{b:m[1]}:{p:m[2]});i=re.lastIndex}if(i<t.length)out.push({x:t.slice(i)});return out}

const pdate=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const dlab=s=>{const d=pdate(s);return `${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`};
const dlabY=s=>{const d=pdate(s);return `${d.getFullYear()}년 ${dlab(s)}`};

function toast(t){const o=$('.toast');if(o)o.remove();const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.appendChild(e);clearTimeout(toastT);toastT=setTimeout(()=>e.remove(),2200)}
function modal(html,bind){const L=$('#layer');L.innerHTML=`<div class="modal"><div class="mbox" role="dialog" aria-modal="true">${html}</div></div>`;
  const m=L.firstChild,close=()=>{L.innerHTML='';document.removeEventListener('keydown',k)},k=e=>{if(e.key==='Escape')close()};
  document.addEventListener('keydown',k);m.addEventListener('click',e=>{if(e.target===m)close()});bind&&bind(m.firstChild,close);return close}
function confirmIn(title,text,yes,onYes){modal(`<h2 style="font-size:26px">${title}</h2><p class="lead">${text}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-no>아니요</button><button class="btn pri" data-yes>${yes}</button></div>`,(b,close)=>{b.querySelector('[data-no]').onclick=close;b.querySelector('[data-yes]').onclick=()=>{close();onYes()}})}

function feelSent(d,lead){const f=d.feels;if(!f.length)return '';const a=f.length>1?`${f[0].replace(/다$/,'고')} ${f[1]}`:f[0];return `${lead||'그때 나는 정말'} ${a}.`+(d.a.body?` ${end(d.a.body)}`:'')}
function sixSent(a){
  const parts=[a.when,a.who,a.where,a.how].map(x=>(x||'').trim()).filter(Boolean);
  let what=(a.what||'').trim();
  const out=[];
  if(what||parts.length){out.push(end([...parts,what||'놀았다'].join(' ')))}
  const why=(a.why||'').trim();
  if(why){out.push(/때문/.test(why)?`왜냐하면 ${end(why)}`:/(서|니까|려고)$/.test(why)?`${why} 그렇게 했다.`:`왜냐하면 ${why} 때문이다.`)}
  return out}
function buildDraft(d){const a=d.a,L=[];
  switch(d.form){
   case 'six':case 'pic':L.push(...sixSent(a));L.push(feelSent(d));break;
   case 'blank':{const T=GUIDE[d.tpl][1];T.forEach((t,i)=>{const parts=parseT(t);let s='',last='',any=false;parts.forEach((p,j)=>{if(p.x)s+=p.x;else if(p.b){const v=(a[`b${d.tpl}_${i}_${j}`]||'').trim();if(v)any=true;last=v;s+=v||'____'}else if(p.p)s+=P(last,p.p)});if(any)L.push(s)});L.push(feelSent(d,'오늘 나는'));break}
   case 'imagine':{if(a.im1)L.push(`오늘 ${a.im1.trim()}${P(a.im1,'을')} 보고 재미있는 상상을 했다.`);if(a.im2)L.push(`만약 ${end(a.im2.replace(/^만약(에)?\s*/,''))}`.replace(/\.$/,'?'));['im3','im4','im5'].forEach(k=>a[k]&&L.push(end(a[k])));L.push(feelSent(d,'상상만 해도'));break}
   case 'letter':{const to=(a.to||'엄마께').trim();L.push(`사랑하는 ${to}`);L.push('');if(a.l1)L.push(end(a.l1));if(a.l2)L.push(end(a.l2));if(d.feels.length)L.push(feelSent(d,'그때 저는'));if(a.l3)L.push(end(a.l3));if(a.l4)L.push(end(a.l4));L.push('');L.push(`${dlab(d.date)}  ${kid()}${/께$/.test(to)?' 올림':(jong(kid())?'이가':'가')}`);break}
   case 'free':['f1','f2','f3'].forEach((k,i)=>{if(a[k]){L.push(end(a[k]));if(i===1&&d.feels.length)L.push(feelSent(d))}});if(!a.f2&&d.feels.length)L.push(feelSent(d));break;
   case 'book':{const t=(a.bt||'').trim();if(t)L.push(`오늘 『${t}』${P(t,'을')} 읽었다.`);if(a.ba){const bk=a.bg?(['동화','그림책','만화'].includes(a.bg)?a.bg:a.bg+' 책'):'책';L.push(`${a.ba.trim()} 작가님이 쓴 ${bk}${P(bk,'이다')}.`)}if(a.b1)L.push(end(a.b1));if(a.b2)L.push(`가장 기억에 남는 장면은 ${end(a.b2)}`);
     if(a.b3){L.push(`‘${BQ[d.bq]}’ 하고 생각해 보았다.`);L.push(end(a.b3))}if(a.bs)L.push(`이 책에 별점을 준다면 별 ${a.bs}개를 주고 싶다.`);L.push(feelSent(d,'책을 다 읽고 나니'));break}
  }
  return L.filter((x,i)=>x!==undefined&&!(x===''&&L[i-1]==='')).join('\n').replace(/\n{3,}/g,'\n\n').replace(/^\n+/,'').trim()+(d.form==='six'||d.form==='pic'?'':'')}

function titleSugs(d){const a=d.a,f=d.feels[0],fa=f?f.replace(/다$/,'던'):'';
  let kw=(a.what||'').trim().replace(/\s*(을|를)?\s*(했다|하였다|했어요|했음)[.!]?$/,'').replace(/[.!]$/,'');
  if(kw.length>12)kw='';
  const T=[];
  if(d.form==='book'&&a.bt)T.push(`『${a.bt.trim()}』${P(a.bt,'을')} 읽고`,`${a.bt.trim()} 속으로`);
  if(d.form==='letter'&&a.to)T.push(`${a.to.trim()} 쓰는 편지`);
  if(d.form==='imagine'&&a.im2)T.push(a.im2.trim().replace(/[.!?]$/,'').slice(0,16)+'?');
  if(d.form==='blank'){const g=GUIDE[d.tpl][0];T.push(g==='오늘 있었던 중요한 일'?'오늘의 중요한 일':g)}
  if(kw){T.push(kw);if(fa)T.push(`${fa} ${kw}`);T.push(`처음 해 본 ${kw}`,`나의 ${kw} 대작전`)}
  if(fa)T.push(`${fa} 날`);
  const tp=topicText(d);if(tp&&tp.length<=14)T.push(tp);
  if(d.wline&&d.wline.length<=16)T.push(d.wline);
  return [...new Set(T.filter(Boolean))].slice(0,7)}

/* ---------- 점검 ---------- */
function analyse(d){const b=d.body||'',bt=b.replace(/\s+/g,' ');
  const feelU=ALLFEEL.filter(w=>new RegExp(w[2]).test(b)).map(w=>w[0]);
  const seen=new Set(),descU=DESC.flatMap(g=>g.w).filter(w=>{const k=dkey(w);if([...seen].some(f=>f.includes(k))||!b.includes(k))return false;seen.add(k);return true});
  const connU=CONNK.filter(k=>b.includes(k));
  const provU=PROV.filter(p=>bt.includes(p[0].slice(0,Math.max(4,p[0].length-2)))).map(p=>p[0]);
  const idiU=IDI.filter(i=>b.includes(i[0])).map(i=>i[0]);
  const sents=(b.match(/[^.!?\n]+[.!?]+/g)||[]).filter(s=>s.trim().length>2).length;
  const chars=b.replace(/\s/g,'').length;
  const sixU=[d.a.who,d.a.where,d.a.what].filter(Boolean).length;
  return{feelU,descU,connU,provU,idiU,sents,chars}}
function checks(d){const r=analyse(d);return[
  ['날씨를 꾸며 썼어요',!!(d.date&&d.weather&&wxWord(d.wline)),wxWord(d.wline)],
  ['제목을 지었어요',!!d.title.trim(),''],
  ['다섯 문장 넘게 썼어요',r.sents>=5,`지금 ${r.sents}문장`],
  ['내 기분을 썼어요',r.feelU.length>0,r.feelU.slice(0,3).join(', ')],
  ['꾸며 주는 말·흉내 내는 말을 썼어요',r.descU.length>0,r.descU.slice(0,3).join(', ')],
  ['이어 주는 말을 썼어요',r.connU.length>0,r.connU.slice(0,3).join(', ')],
  ['마음 정리 카드를 세 칸 넘게 채웠어요',wuCount(d)>=3,`${wuCount(d)}칸`],
  ['다시 읽으며 틀린 글자를 고쳤어요',!!d.manual,'스스로 체크해요','manual'],
  ['보너스: 속담이나 사자성어에 도전!',r.provU.length+r.idiU.length>0,[...r.provU,...r.idiU].slice(0,2).join(', '),'bonus']]}
function starsOf(d){const c=checks(d),base=c.filter(x=>x[3]!=='bonus'&&x[1]).length;return base>=7?3:base>=5?2:base>=3?1:0}
const NBASE=8;

/* ---------- 엄마에게 보내기 ---------- */
function msgOf(d){const r=analyse(d),c=checks(d),s=starsOf(d);
  const L=[`💌 [${kid()}의 일기 도우미] ${kid()} 일기`,`${dlabY(d.date)} · 날씨: ${wName(d.weather)||'-'}${d.wline?` (${d.wline})`:''}`,''];
  L.push(`제목: ${d.title||'(아직 없음)'}`);
  L.push(`주제: ${topicText(d)||'-'} / 양식: ${(FK[d.form]||{}).t||'-'}`);
  if(d.feels.length)L.push(`오늘 기분: ${d.feels.join(', ')}`);
  if(d.form==='book'&&d.a.bt)L.push(`읽은 책: 『${d.a.bt}』${d.a.ba?' · '+d.a.ba:''}${d.a.bs?' · 별 '+d.a.bs+'개':''}`);
  L.push('──────────',(d.body||'(아직 쓰지 않았어요)').trim(),'──────────');
  const wl=wuLines(d),mm=R(d).memos;if(wl.length||mm.length){L.push('[하루 마무리]');wl.forEach(x=>L.push(`· ${x[0]}: ${x[1]}`));if(mm.length)L.push(`· 내일 꼭 기억할 일: ${mm.map(x=>(x.done?'☑ ':'☐ ')+x.t).join(', ')}`);L.push('')}
  L.push(`✔ 스스로 점검 ${c.filter(x=>x[1]&&x[3]!=='bonus').length}/${NBASE}  ${'★'.repeat(s)}${'☆'.repeat(3-s)}`);
  const miss=c.filter(x=>!x[1]&&x[3]!=='bonus').map(x=>x[0]);if(miss.length)L.push(`   다음에 도전: ${miss.join(' / ')}`);
  const u=[...r.descU.map(x=>x+'(꾸밈말)'),...r.connU.map(x=>x+'(이어 주는 말)'),...r.provU.map(x=>x+'(속담)'),...r.idiU.map(x=>x+'(사자성어)')];
  if(u.length)L.push(`사용한 표현: ${u.slice(0,10).join(', ')}`);
  L.push(`글자 수 ${r.chars}자 · ${r.sents}문장`);
  if(d.pic)L.push('(그림일기 그림은 화면을 캡처해서 함께 보내요)');
  return L.join('\n')}
function openSend(d){const text=msgOf(d);

 body:'학교 끝나고 친구랑 놀이터에서 땀을 뻘뻘 흘리며 얼음땡을 했다. 하윤이가 같이 하자고 해서 그렇게 했다.\n처음에는 내가 술래였다. 친구들이 깡충깡충 도망가서 잡기가 어려웠다. 그런데 하윤이가 미끄럼틀 뒤에 살금살금 숨는 것을 봤다. 나는 성큼성큼 달려가서 “땡!” 하고 잡았다.\n그때 나는 정말 신났다. 어깨가 들썩들썩했다. 다음에는 술래가 되어도 더 빨리 잡고 싶다.',pic:null,manual:true,sample:true,r:{praise:'술래가 되어도 포기하지 않았어',want:'친구들이랑 얼음땡 한 판 더 하고 싶어',line:'“네가 술래 하니까 더 재밌다!”',who:'친구',thanks:'하윤아, 같이 놀자고 해 줘서 고마워',vow:'물 많이 마시기',memos:[{t:'물병 챙기기',done:true},{t:'알림장 보여 드리기',done:false}]}};

function weekDays(){const t=new Date(),m=new Date(t);m.setDate(t.getDate()-((t.getDay()+6)%7));return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d})}

function initPad(m){const d=D(),cv=m.querySelector('#cv'),cx=cv.getContext('2d');const hist=[];
  const blank=()=>{cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height)};blank();
  if(d.pic){const im=new Image();im.onload=()=>cx.drawImage(im,0,0,cv.width,cv.height);im.src=d.pic}
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  let drawing=false,last=null;
  const store=()=>{try{d.pic=cv.toDataURL('image/png');save()}catch(e){}};
  cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);drawing=true;last=pos(e);hist.push(cx.getImageData(0,0,cv.width,cv.height));if(hist.length>15)hist.shift();dot(last)};
  const dot=p=>{cx.beginPath();cx.fillStyle=pen.er?'#fff':pen.c;cx.arc(p[0],p[1],(pen.er?pen.s*2.2:pen.s)/2,0,Math.PI*2);cx.fill()};
  cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);cx.strokeStyle=pen.er?'#fff':pen.c;cx.lineWidth=pen.er?pen.s*2.2:pen.s;cx.lineCap='round';cx.lineJoin='round';cx.beginPath();cx.moveTo(last[0],last[1]);cx.lineTo(p[0],p[1]);cx.stroke();last=p};
  const up=()=>{if(drawing){drawing=false;store()}};cv.onpointerup=up;cv.onpointercancel=up;
  m.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{pen.c=b.dataset.c;pen.er=false;m.querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed',x===b));m.querySelector('#er').setAttribute('aria-pressed','false')});
  m.querySelectorAll('[data-sz]').forEach(b=>b.onclick=()=>{pen.s=+b.dataset.sz;m.querySelectorAll('[data-sz]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  m.querySelector('#er').onclick=e=>{pen.er=!pen.er;e.currentTarget.setAttribute('aria-pressed',pen.er)};
  m.querySelector('#undo').onclick=()=>{const h=hist.pop();if(h){cx.putImageData(h,0,0);store()}};
  m.querySelector('#clr').onclick=()=>{hist.push(cx.getImageData(0,0,cv.width,cv.height));blank();d.pic=null;save()}}

 memo:['준비물 챙기기','숙제 내기','알림장 보여 드리기','도서관 책 반납하기','실내화 가져가기','학원 가방 챙기기','물병 챙기기']};
const R=d=>{d.r=d.r||{};d.r.memos=d.r.memos||[];return d.r};
function wuCount(d){const r=R(d);return ['praise','regret','want','line','thanks','vow'].filter(k=>(r[k]||'').trim()).length+(r.memos.length?1:0)}
function wuLines(d){const r=R(d),L=[];
  if(r.praise)L.push(['나에게 칭찬',r.praise]);if(r.regret)L.push(['반성할 점',r.regret]);if(r.want)L.push(['하고 싶은 것',r.want]);
  if(r.line)L.push(['기억에 남은 한 문장',`“${r.line}”`]);if(r.thanks)L.push(['감사한 마음',(r.who?r.who+(['엄마','아빠','선생님','할머니','할아버지'].includes(r.who)?'께':'에게')+' · ':'')+r.thanks]);
  if(r.vow)L.push(['내일의 다짐',r.vow]);return L}
function sentsOf(b){return (String(b||'').match(/[^.!?\n]+[.!?]+/g)||[]).map(s=>s.trim()).filter(s=>s.length>4)}

   ${chips?`<div class="chips">${chips.map(c=>`<button class="chip" data-rk="${key}" data-v="${esc(c)}" aria-pressed="${r[key]===c}">${esc(c)}</button>`).join('')}</div>`:''}
   <input id="r_${key}" data-r="${key}" value="${esc(r[key]||'')}" placeholder="${esc(ph)}" maxlength="80"></div>`}
function memoHTML(memos,editable){return `<ul class="memos">${memos.map((x,i)=>`<li class="${x.done?'done':''}"><label><input type="checkbox" data-mi="${i}" ${x.done?'checked':''}><span class="cb ${x.done?'on':''}"></span><span class="mt">${esc(x.t)}</span></label>${editable?`<button class="mdel" data-md="${i}" aria-label="${esc(x.t)} 지우기">×</button>`:''}</li>`).join('')}</ul>`}
function st5(m){const d=D(),r=R(d),n=wuCount(d),ss=sentsOf(d.body);
  say(n>=4?['마음 정리 카드가 꽉 찼네!','칭찬도 하고, 고마운 사람도 떠올리고, 내일 할 일까지 챙겼어. 멋져!']:['일기를 다 썼으면 <b>오늘 하루를 정리</b>해 보자.','나에게 칭찬 한마디, 고마운 사람, 내일 꼭 기억할 일을 적어 두면 내일의 내가 고마워할 거야.'],n>=4?'cheer':'happy','mongi');
  m.innerHTML=`<section class="card"><h2><span class="circ">6</span>마음 정리</h2>
   <p class="lead">하루를 돌아보는 카드예요. 칩을 누르거나 직접 써요. 세 칸 넘게 채우면 점검표에 체크돼요. (지금 ${n}칸)</p>
   <div class="wu-grid">
    <div class="box wu1"><h4>나에게</h4>
     ${wuField('praise',1,'오늘 나를 칭찬해요','예: 받아쓰기를 끝까지 집중해서 했어',WU.praise)}
     ${wuField('regret',2,'오늘 반성할 점','예: 동생 장난감을 허락 없이 썼어',WU.regret)}
     ${wuField('want',3,'요즘 하고 싶은 것','예: 공룡 박물관에 가 보고 싶어',WU.want)}</div>
    <div class="box lav wu2"><h4>마음에 남은 것</h4>
     <div class="q"><label for="r_line"><span class="circ">4</span>기억에 남은 한 문장</label><p class="ex">오늘 일기에서 고르거나, 오늘 들은 말·읽은 문장을 써요.</p>
      ${ss.length?`<div class="chips">${ss.slice(0,8).map(s=>`<button class="chip" data-rk="line" data-v="${esc(s)}" aria-pressed="${r.line===s}">${esc(s.length>28?s.slice(0,27)+'…':s)}</button>`).join('')}</div>`:''}
      <input id="r_line" data-r="line" value="${esc(r.line||'')}" placeholder="예: 선생님이 “실수해도 괜찮아”라고 하셨다" maxlength="80"></div>
     <div class="q"><label for="r_thanks"><span class="circ">5</span>감사한 마음</label>
      <div class="chips">${WU.who.map(c=>`<button class="chip y" data-rk="who" data-v="${c}" aria-pressed="${r.who===c}">${c}</button>`).join('')}</div>
      <input id="r_thanks" data-r="thanks" value="${esc(r.thanks||'')}" placeholder="${r.who?esc(r.who)+P(r.who,'이')+' 무엇을 해 줘서 고마웠나요?':'예: 엄마, 맛있는 김밥을 싸 주셔서 고마워요'}" maxlength="80"></div></div>
    <div class="box pink wu3"><h4>내일을 위해</h4>
     ${wuField('vow',6,'내일의 다짐','예: 내일은 일찍 일어나서 아침밥을 꼭 먹을 거야',WU.vow)}
     <div class="q"><label for="memoIn"><span class="circ">7</span>내일 꼭 기억할 일 · 메모 체크</label><p class="ex">적어 두면 첫 화면에 나와요. 다 하면 체크해요!</p>
      <div class="chips">${WU.memo.map(c=>`<button class="chip" data-mq="${esc(c)}" ${r.memos.some(x=>x.t===c)?'aria-pressed="true"':''}>+ ${esc(c)}</button>`).join('')}</div>
      <div class="row"><input id="memoIn" placeholder="예: 리코더 가져가기" maxlength="40" style="flex:1;min-width:0"><button class="btn sm" id="memoAdd">추가</button></div>
      ${r.memos.length?memoHTML(r.memos,true):'<p class="ex">아직 메모가 없어요.</p>'}</div></div>
   </div>
   <div class="nav"><button class="btn" data-prev>← 일기 고치기</button><button class="btn pri" data-next>다 썼어요 →</button></div></section>`;
  m.querySelectorAll('[data-r]').forEach(inp=>inp.oninput=()=>{r[inp.dataset.r]=inp.value;save();m.querySelectorAll(`[data-rk="${inp.dataset.r}"]`).forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===inp.value))});
  m.querySelectorAll('[data-rk]').forEach(b=>b.onclick=()=>{const k=b.dataset.rk;r[k]=r[k]===b.dataset.v?'':b.dataset.v;save();render()});
  const add=t=>{t=t.trim();if(!t||r.memos.some(x=>x.t===t))return;r.memos.push({t,done:false});save();render()};
  m.querySelectorAll('[data-mq]').forEach(b=>b.onclick=()=>add(b.dataset.mq));
  const mi=m.querySelector('#memoIn');m.querySelector('#memoAdd').onclick=()=>add(mi.value);mi.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add(mi.value)}};
  m.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{r.memos.splice(+b.dataset.md,1);save();render()});
  m.querySelectorAll('[data-mi]').forEach(c=>c.onchange=()=>{r.memos[+c.dataset.mi].done=c.checked;save();render()})}

/* ⑦ 다 썼어요 */
function st6(m){
const d=D(),c=checks(d),s=starsOf(d),r=analyse(d);
  const miss=c.filter(x=>!x[1]&&x[3]!=='bonus');
  say(s>=3?[`우와, <b>별 세 개</b>! 정말 멋진 일기야.`,'일기장에 넣고 엄마에게도 보내 줘. 엄마가 엄청 기뻐할 거야!']:[`여기까지 쓴 것도 정말 잘했어!`,miss.length?`<b>${esc(miss[0][0])}</b>에 도전하면 별을 더 받을 수 있어.`:'일기장에 넣고 엄마에게 보내 줘!'],s>=3?'cheer':'happy');
  m.innerHTML=`<section class="card"><h2><span class="circ">7</span>다 썼어요!</h2>
   <div class="done-top">
    <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
     <div class="award"><div class="stampbig">참<br>잘했어요</div><div><div class="bigstar" aria-label="별 ${s}개">${'★'.repeat(s)}<span class="off">${'★'.repeat(3-s)}</span></div><p class="lead">스스로 점검 ${c.filter(x=>x[1]&&x[3]!=='bonus').length} / ${NBASE}</p></div></div>
     <ul class="checks">${c.map((x,i)=>x[3]==='manual'?`<li><label for="manual"><input type="checkbox" id="manual" ${d.manual?'checked':''}><span class="cb ${d.manual?'on':''}"></span>${x[0]}</label></li>`:`<li><span class="cb ${x[1]?'on':''}"></span><span>${x[0]} ${x[2]?`<small>${esc(x[2])}</small>`:''}</span></li>`).join('')}</ul>
     ${(r.feelU.length+r.descU.length+r.connU.length+r.provU.length+r.idiU.length)?`<div><h3 style="font-size:22px;margin-bottom:6px">내가 쓴 멋진 표현</h3><div class="used">${r.feelU.map(x=>`<span class="f">${x}</span>`).join('')}${r.descU.map(x=>`<span>${x}</span>`).join('')}${r.connU.map(x=>`<span class="c">${x}</span>`).join('')}${[...r.provU,...r.idiU].map(x=>`<span class="p">${x}</span>`).join('')}</div></div>`:''}
     <div class="row"><button class="btn" data-prev>← 더 고치기</button><button class="btn pri" id="saveE">${d.id?'일기장에 다시 넣기':'일기장에 넣기'}</button><button class="btn soft" id="sendE">엄마에게 보내기</button></div>
    </div>
    <div style="min-width:0">${pageHTML(d)}</div>
   </div></section>`;
  fitGrid(m);
  m.querySelector('#manual').onchange=e=>{d.manual=e.target.checked;save();render()};
  m.querySelector('#sendE').onclick=()=>openSend(d);
  m.querySelector('#saveE').onclick=()=>{const e=JSON.parse(JSON.stringify(d));e.savedAt=Date.now();
    if(d.id){const i=S.entries.findIndex(x=>x.id===d.id);if(i>=0)S.entries[i]=e;else S.entries.push(e)}else{e.id='d'+Date.now();S.entries.push(e)}
    S.draft=null;save();view='home';render();scrollTo({top:0});toast('일기장에 넣었어요! 도장 쾅 💮')}}

function render(){if(view==='write'&&S.draft)renderWrite();else{view='home';renderHome()}}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>fitGrid(document),200)});
render();
})();
</script>
